# Picker styling for the SUPER+SHIFT+V clipboard history.
#
# fuzzel has no COSMIC integration — it reads only this file — so these are
# COSMIC's own values copied across by hand, from
# ~/.config/cosmic/com.system76.CosmicTheme.Dark/v2/{accent,background,corner_radii}.
# COSMIC stores colours as "#RRGGBBAA"; fuzzel wants the same value with the
# leading # dropped. Change the accent or switch to a light theme and these
# need re-pulling — nothing updates them automatically.
#
# The COSMIC token each colour came from is named above it.

# Same font as Ghostty, so the picker reads like the terminal it's usually
# invoked from. Monospace also aligns cliphist's leading ID column, and it
# carries the Nerd Font clipboard glyph the picker uses as its prompt —
# Open Sans (COSMIC's own UI font) has neither property.
font=JetBrainsMono Nerd Font:size=11
lines=14
width=72

# COSMIC's chrome is airy — these paddings and the line height are what make
# the picker feel like a COSMIC dialog rather than a bare dmenu box.
horizontal-pad=24
vertical-pad=16
inner-pad=12
line-height=22

[colors]
# background.base, at 95% — echoes the panel's own translucency (F2 = 95%)
background=1B1B1BF2
# background.on — COSMIC's off-white body text, softer than pure #FFFFFF
text=F5F5F5FF
prompt=F5F5F5FF
input=F5F5F5FF
# background.component.on_disabled — dimmed, for placeholder and the counter
placeholder=FFFFFFA6
counter=FFFFFFA6
# background.component.hover — the grey COSMIC fills a hovered list row with
selection=434343FF
# background.component.on
selection-text=FFFFFFFF
# accent.base — the only place orange appears: the selected row's matched
# characters and the search matches themselves
match=FF7300FF
selection-match=FF7300FF
# background.divider — a hairline, not the loud accent outline
border=474747FF

[border]
# corner_radii.radius_m for the window, radius_s for the selected row
radius=16
selection-radius=8
width=1
